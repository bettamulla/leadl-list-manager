const KEY='dq1',T=30,$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const np=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('44'))d='0'+d.slice(2);return d.length>=10?d:''};
const fit=l=>/window|glaz|door|conservator|sunroom|porch|bifold|fascia/i.test(l.k+' '+l.n)?0:/kitchen|bathroom|home improvement/i.test(l.k)?1:2;
const ty=p=>/^07/.test(p)?'Mobile':/^08/.test(p)?'Freephone':'Landline';
const mk=(r,i)=>({id:i,n:r.n,p:r.p,c:r.c,z:r.z,k:r.k,s:r.s,r:r.r||0,w:r.w,e:r.e,st:'new',a:0,tps:'new'});
const OUT=[['No answer','na'],['Call back','cb'],['Not interested','ni'],['Send info','si'],['Booked 15 min','bk'],['Wrong number','wn']];
const SAY={A:'Kwon here, quick one. When you send a quote and the customer goes quiet, what happens to it?',B:'Kwon here, I’ll be quick. Most window firms have hundreds of old quotes nobody chases. I turn them back into booked re-quotes. Worth 15 minutes?'};
let S,view='dial',flt='',fst='all',msg='';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.leads)S={leads:DATA.map(mk),dnc:{},log:[],v:'A'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const active=l=>l.st!=='done'&&l.st!=='dnc'&&!S.dnc[l.p];
const queue=()=>S.leads.filter(l=>active(l)&&l.tps==='clear').sort((a,b)=>a.a-b.a||fit(a)-fit(b)||(!!b.e-!!a.e)||b.r-a.r);
function addDnc(l,why){S.dnc[l.p]={n:l.n,d:today(),w:why};l.st='dnc'}
function out(c){const l=queue()[0];if(!l)return;
 S.log.push({t:new Date().toISOString(),n:l.n,p:l.p,o:c,ob:($('#ob')||{}).value||'',nt:($('#nt')||{}).value||'',v:S.v});
 l.a++;if(c==='na'||c==='cb'){if(l.a>=3)l.st='done'}else l.st='done';save();render()}
function dncNow(){const l=queue()[0];if(!l)return;S.log.push({t:new Date().toISOString(),n:l.n,p:l.p,o:'dnc',ob:'',nt:'',v:S.v});addDnc(l,'Asked not to be called');save();render()}
function skip(){const l=queue()[0];if(l){l.a++;save();render()}}
function setV(v){S.v=v;save();render()}
function tab(v){view=v;msg='';render()}
function show(t,x){msg=`<div class="card"><h2>${t}</h2><textarea id="tx" rows="8" readonly>${esc(x)}</textarea><button class="s" onclick="cp()">Copy</button></div>`;render()}
function cp(){const t=$('#tx');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}}
function unscreened(){show('Numbers to screen (TPS and CTPS)',[...new Set(S.leads.filter(l=>active(l)&&l.tps==='new').map(l=>l.p))].join('\n'))}
function blocked(){const set=new Set(($('#bl').value.match(/[+\d][\d ]{9,}/g)||[]).map(np));let n=0;
 S.leads.forEach(l=>{if(set.has(l.p)&&l.st!=='dnc'){l.tps='blocked';addDnc(l,'TPS/CTPS registered');n++}});save();msg=`<div class="card">${n} blocked and added to the DNC list.</div>`;render()}
function cleared(){let n=0;S.leads.forEach(l=>{if(active(l)&&l.tps==='new'){l.tps='clear';n++}});save();msg=`<div class="card">${n} numbers marked clear.</div>`;render()}
function addNums(){const w=$('#dw').value||'Manual';(($('#dn').value.match(/[+\d][\d ]{9,}/g))||[]).map(np).filter(Boolean).forEach(p=>{S.dnc[p]={n:'(manual)',d:today(),w};S.leads.forEach(l=>{if(l.p===p)l.st='dnc'})});save();render()}
function csv(t){const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
function imp(e){const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const R=csv(fr.result),h=R[0],ix=k=>h.indexOf(k);
 const have=new Set(S.leads.map(l=>l.p));let n=0,skip=0;
 R.slice(1).forEach(r=>{const p=np(r[ix('phone')]);if(!p||have.has(p)||S.dnc[p]||r[ix('permanentlyClosed')]==='true'||r[ix('temporarilyClosed')]==='true'){skip++;return}
 have.add(p);S.leads.push(mk({n:r[ix('title')],p,c:r[ix('city')],z:r[ix('postalCode')],k:r[ix('categoryName')],s:r[ix('totalScore')],r:+r[ix('reviewsCount')],w:r[ix('website')],e:r[ix('emails/0')]},Date.now()+n));n++});
 save();msg=`<div class="card">${n} new leads added, ${skip} skipped (closed, duplicate, no phone or DNC). Screen them before dialling.</div>`;render()};fr.readAsText(f)}
function rows(){const q=flt.toLowerCase();let L=S.leads.filter(l=>(!q||(l.n+l.c+l.k+l.p).toLowerCase().includes(q))&&(fst==='all'||(fst==='queue'&&active(l)&&l.tps==='clear')||(fst==='new'&&active(l)&&l.tps==='new')||(fst==='done'&&l.st==='done')||(fst==='dnc'&&l.st==='dnc')));
 $('#rows').innerHTML=`<p class="mu">${L.length} leads${L.length>80?' (first 80 shown)':''}</p><div class="w"><table><tr><th>Business</th><th>Phone</th><th>Town</th><th>Type</th><th>Status</th></tr>${L.slice(0,80).map(l=>`<tr><td>${esc(l.n)}</td><td>${l.p}</td><td>${esc(l.c)}</td><td>${ty(l.p)}</td><td>${l.st==='dnc'?'<span class="bad">DNC</span>':l.st==='done'?esc(l.res||'done'):l.tps==='clear'?'<span class="ok">ready</span>':'unscreened'}</td></tr>`).join('')}</table></div>`}
function fl(v){flt=v;rows()}function fs(v){fst=v;rows()}
function render(){const td=today(),L=S.log.filter(x=>x.t.slice(0,10)===td),d=L.length,cv=L.filter(x=>['ni','si','bk','cb'].includes(x.o)).length,y=L.filter(x=>x.o==='bk').length,Q=queue(),un=S.leads.filter(l=>active(l)&&l.tps==='new').length;
 let h=`<div class="top"><h1><span class="dial">Dial</span> queue</h1></div><div class="bar"><i style="width:${Math.min(100,d/T*100)}%"></i></div><div class="st"><span><b>${d}</b> / ${T} dials</span><span><b>${cv}</b> conversations</span><span><b>${y}</b> booked</span><span><b>${Q.length}</b> in queue</span></div>
 <nav>${[['dial','Dial'],['list','List'],['dnc','Do not call'],['log','Log']].map(v=>`<button class="${view===v[0]?'on':''}" onclick="tab('${v[0]}')">${v[1]}</button>`).join('')}</nav>${msg}`;
 if(view==='dial'){h+='<div class="dg"><div>';const l=Q[0];
  if(un)h+=`<div class="card warn"><b>${un} numbers aren’t screened yet.</b> They stay out of the queue until you screen them under “List and screening”.</div>`;
  h+=l?`<div class="card"><p class="mu">Next up · attempt ${l.a+1} of 3 · ${ty(l.p)}${ty(l.p)==='Mobile'?' (may be a sole trader)':''}</p><p class="name">${esc(l.n)}</p><div class="mu">${esc(l.k)} · ${esc(l.c)} ${esc(l.z)}${l.s?` · ${l.s}★ (${l.r})`:''}</div>
  <a class="num" href="tel:${l.p}">${l.p}</a>${l.w?`<a class="mu" href="${esc(l.w)}" target="_blank" rel="noopener">${esc(l.w.replace(/^https?:\/\/(www\.)?/,'').slice(0,50))}</a>`:''}
  <div class="say"><b>Opener ${S.v}</b><br>${SAY[S.v]}</div><button class="s" onclick="setV('${S.v==='A'?'B':'A'}')">Switch to ${S.v==='A'?'B':'A'}</button><p class="mu">If you’re recording: say “this call may be recorded.”</p>
  <textarea id="ob" rows="2" placeholder="Objection, word for word" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea><textarea id="nt" rows="3" placeholder="Notes" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
  <div class="grid">${OUT.map(o=>`<button class="o ${o[1]==='bk'?'bk':''}" onclick="out('${o[1]}')">${o[0]}</button>`).join('')}<button class="o dn" onclick="dncNow()">Do not call</button><button class="o" onclick="skip()">Skip</button></div></div>`
  :`<div class="card">Queue empty. ${un?'Screen your unscreened numbers.':'Import a new batch from the List tab.'}</div>`;h+=`</div><aside class="card up"><h2>Up next</h2>${Q.slice(1,8).map(x=>`<div><span>${esc((x.n||'').slice(0,28))}</span><span class="mu">${esc(x.c||'')}</span></div>`).join('')||'<p class="mu">Nothing else queued.</p>'}</aside></div>`}
 if(view==='list')h+=`<div class="card"><h2>Screening</h2><p class="mu">1. Copy the numbers and run them through a TPS and CTPS checker.<br>2. Paste any registered numbers below.<br>3. Mark the rest clear.</p><button class="s" onclick="unscreened()">1. Copy numbers to screen (${un})</button><textarea id="bl" rows="3" placeholder="2. Paste registered numbers here"></textarea><button class="s" onclick="blocked()">Block these</button><button class="s" onclick="cleared()">3. Mark the rest clear</button></div>
  <div class="card"><h2>Import</h2><p class="mu">Add a new Apify Google Maps export (CSV). Closed businesses, duplicates and DNC numbers are skipped.</p><input type="file" accept=".csv" onchange="imp(event)"></div>
  <input placeholder="Search name, town, type or number" oninput="fl(this.value)" value="${esc(flt)}"><select onchange="fs(this.value)">${[['all','All'],['queue','Ready to dial'],['new','Unscreened'],['done','Done'],['dnc','Do not call']].map(v=>`<option value="${v[0]}"${fst===v[0]?' selected':''}>${v[1]}</option>`).join('')}</select><div id="rows"></div>`;
 if(view==='dnc')h+=`<div class="card"><h2>Do not call (${Object.keys(S.dnc).length})</h2><p class="mu">Never dialled again. Add anyone who asks to be left alone.</p><textarea id="dn" rows="2" placeholder="Numbers, one per line"></textarea><input id="dw" placeholder="Reason"><button class="s" onclick="addNums()">Add</button><button class="s" onclick="show('Do not call list',Object.entries(S.dnc).map(([p,v])=>[p,v.n,v.d,v.w].join(',')).join('\\n'))">Copy list</button></div>`;
 if(view==='log'){const st=v=>{const x=S.log.filter(z=>z.v===v&&!['na','wn','dnc'].includes(z.o));return `${v}: ${x.length} conversations, ${x.filter(z=>z.o==='bk').length} booked`};
  h+=`<div class="card"><h2>Opener results</h2><p>${st('A')}<br>${st('B')}</p><button class="s" onclick="show('Call log (CSV)','time,business,phone,outcome,objection,notes,opener\\n'+S.log.map(x=>[x.t,x.n,x.p,x.o,x.ob,x.nt,x.v].map(c=>'\"'+String(c).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n'))">Copy log as CSV</button></div><div class="w"><table>${S.log.slice(-50).reverse().map(x=>`<tr><td>${x.t.slice(5,16).replace('T',' ')}</td><td>${esc(x.n)}</td><td>${x.o}</td><td>${esc(x.ob)}</td></tr>`).join('')}</table></div>`}
 $('#app').innerHTML=h;$('.by').style.display=view==='dial'?'':'none';if(view==='list')rows()}
render();
